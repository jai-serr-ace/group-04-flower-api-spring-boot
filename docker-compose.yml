services:
  db:
    image: postgres:16-alpine
    container_name: flower-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowerdb
      POSTGRES_USER: floweruser
      POSTGRES_PASSWORD: flowerpassword
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floweruser -d flowerdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flower-api-service
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      LOCAL_DB_HOST: db
      LOCAL_DB_PORT: 5432
      LOCAL_DB_NAME: flowerdb
      LOCAL_DB_USER: floweruser
      LOCAL_DB_PASSWORD: flowerpassword
      LOCAL_DB_SSLMODE: disable
      LOCAL_MIGRATIONS_ENABLED: "true"
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-local-testing-client-id}
      PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
