services:
  db:
    image: postgres:16-alpine
    container_name: flower-api-postgres
    restart: always
    environment:
      POSTGRES_DB: flowerdb
      POSTGRES_USER: floweruser
      POSTGRES_PASSWORD: flowerpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floweruser -d flowerdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flower-api-service
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flowerdb
      SPRING_DATASOURCE_USERNAME: floweruser
      SPRING_DATASOURCE_PASSWORD: flowerpassword
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
