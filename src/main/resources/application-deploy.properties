# Deployment reads environment variables only; no .env file imports or defaults
# for database credentials or the Google client ID.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.security.oauth2.resourceserver.jwt.audiences=${GOOGLE_WEB_CLIENT_ID}

# The existing Railway schema is managed separately. Enable deliberately only
# after reviewing the migrations and the target database's Flyway history.
spring.flyway.enabled=${DEPLOY_MIGRATIONS_ENABLED:false}
server.error.include-message=never
server.error.include-stacktrace=never
# Render terminates HTTPS before forwarding requests to the container.
server.forward-headers-strategy=framework
