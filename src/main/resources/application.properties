spring.config.import=optional:file:.env[.properties]

spring.application.name=flower-api
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# OAuth2 Resource Server: accepts Google ID tokens in the Authorization: Bearer header.
# issuer-uri validates that tokens were issued by Google; audiences validates this app's
# Google OAuth client ID. For local testing without Google sign-in, comment out both
# OAuth2 properties below. Do not use that unauthenticated configuration in production.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
spring.security.oauth2.resourceserver.jwt.audiences=${GOOGLE_WEB_CLIENT_ID}