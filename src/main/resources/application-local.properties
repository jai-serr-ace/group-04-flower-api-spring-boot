# Keep existing IntelliJ runs connected using .env. Optional .env.local settings
# take precedence when deliberately testing against a separate local database.
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]

# LOCAL_* overrides are opt-in; otherwise preserve the working PG* connection.
spring.datasource.url=jdbc:postgresql://${LOCAL_DB_HOST:${PGHOST}}:${LOCAL_DB_PORT:${PGPORT}}/${LOCAL_DB_NAME:${PGDATABASE}}?sslmode=${LOCAL_DB_SSLMODE:require}
spring.datasource.username=${LOCAL_DB_USER:${PGUSER}}
spring.datasource.password=${LOCAL_DB_PASSWORD:${PGPASSWORD}}

# Never migrate the existing shared database during an ordinary local run.
spring.flyway.enabled=${LOCAL_MIGRATIONS_ENABLED:false}

# Public GET routes work without a Google token. Set the real client ID in
# .env.local to test authenticated requests with Google sign-in.
spring.security.oauth2.resourceserver.jwt.audiences=${GOOGLE_WEB_CLIENT_ID:local-testing-client-id}
