# Create a NEW web service. Supply database settings and the Google web client ID
# in the Blueprint creation form. No .env file is uploaded.
services:
  - type: web
    name: flower-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: deploy
      - key: PORT
        value: "8080"
      # true for a new/Flyway-managed DB; false for an existing unmanaged schema.
      - key: DEPLOY_MIGRATIONS_ENABLED
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
